[project]
name = "waferscan"
version = "1.0.0"
description = "WM-811K wafer-map defect classification with uncertainty, verification, quantification and root-cause inference"
requires-python = ">=3.10"   # the api extra needs 3.11+ (scikit-learn 1.8)
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "joblib>=1.3",
  "opencv-python-headless>=4.9",
  "pillow>=10.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "httpx>=0.27", "onnxruntime>=1.18",
       "scikit-learn==1.8.0"]   # pinned: the committed model_bundle/stack.joblib is a pickle of sklearn 1.8 objects
train = ["torch>=2.3", "timm>=1.0", "mlflow>=2.14", "onnx>=1.16", "onnxruntime>=1.18", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["waferscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
