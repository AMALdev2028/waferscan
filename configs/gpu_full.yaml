# Full WM-811K on a GPU (Kaggle / Colab / k8s Job). Train each backbone, then
# stack them:  python -m waferscan.training.stack --runs runs/wafernet runs/swin_t ...
# Rough times per fold on a free T4 (12 epochs, ~38k wafers/epoch):
#   wafernet ~6 min · swin_t ~26 min · seresnext101 ~50 min · efficientnet_b7 ~85 min
# Every epoch is checkpointed; re-run the same command after a disconnect to resume.
data:
  source: npz                        # make it once: python -m waferscan.data.wm811k --pkl LSWMD.pkl
  path: data/processed/wm811k.npz    #   (keeps all labelled wafers, 'none' capped at 20k; groups = lots)
  size: 64
model:
  backbone: swin_t                   # wafernet | efficientnet_b7 | seresnext101 | swin_t
  dropout: 0.3
  pretrained: true                   # ImageNet weights from the timm hub (needs internet)
train:
  folds: 5
  split: grouped                     # groups = lotName: a lot never straddles train/val
  epochs: 12
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.05
  cosine_restarts: {T_0: 4, T_mult: 2, eta_min: 0.000001}
  label_smoothing: 0.1
  focal_gamma: {start: 0.0, end: 2.0, ramp: 0.5}
  class_balance_beta: 0.9999
  evidential_weight: 0.5
  evidential_anneal: 0.5
  oversample_to: 1000                # Near-full has 149 wafers, Donut 555: rotate/flip them up to 1000
  seed: 42
  num_threads: 0
output:
  dir: runs/gpu
mlflow:
  experiment: waferscan-gpu
  tracking_uri: null
